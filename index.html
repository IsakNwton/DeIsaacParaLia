                   <h2 className="text-4xl md:text-6xl text-white font-black animate-bounce mb-2 drop-shadow-lg text-center px-4">¡CIMA ALCANZADA!</h2>
                   <p className="text-cyan-200 text-xl font-bold">¡Sobreviviste a la Antártida!</p>
                 </div>
               )}

               <div className="absolute bottom-6 left-6 z-40">
                  <button 
                    onMouseDown={() => handleTouchStart('left')} onMouseUp={() => handleTouchEnd('left')} onMouseLeave={() => handleTouchEnd('left')}
                    onTouchStart={(e) => { e.preventDefault(); handleTouchStart('left'); }} onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('left'); }} 
                    className="w-20 h-20 bg-white/10 backdrop-blur-md rounded-full border-[3px] border-white/30 flex items-center justify-center active:bg-white/30 shadow-xl"
                  >
                    <ArrowLeft size={36} className="text-white" />
                  </button>
               </div>
               <div className="absolute bottom-6 right-6 z-40">
                  <button 
                    onMouseDown={() => handleTouchStart('right')} onMouseUp={() => handleTouchEnd('right')} onMouseLeave={() => handleTouchEnd('right')}
                    onTouchStart={(e) => { e.preventDefault(); handleTouchStart('right'); }} onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('right'); }} 
                    className="w-20 h-20 bg-white/10 backdrop-blur-md rounded-full border-[3px] border-white/30 flex items-center justify-center active:bg-white/30 shadow-xl"
                  >
                    <ArrowRight size={36} className="text-white" />
                  </button>
               </div>

               {gameOver && <RetryScreen onRetry={resetGame} message="Moriste de hipotérmica o algo así. Es la antártida." />}
            </div>
          );
        };

        // JUEGO 5: LA RECETA DEL CORAZÓN
        const LoveHeartGame = ({ onWin }) => {
          const [fill, setFill] = useState(0);
          const [floatingItems, setFloatingItems] = useState([]);
          const [completed, setCompleted] = useState(false);
          const [shake, setShake] = useState(false);

          // Fotos de cosas que SI le gustan
          const goodItemsDef = [
            { img: PHOTOS.quiz4, text: "5sos", type: 'good' },
            { img: PHOTOS.shawarma, text: "shawarma", type: 'good' },
            { img: PHOTOS.nahla, text: "Nahla", type: 'good' },
            { img: PHOTOS.avatar, text: "Tu", type: 'good' }
          ];

          // Fotos de cosas que NO le gustan
          const badItemsDef = [
            { img: PHOTOS.bad1, text: "Fifes", type: 'bad' },
            { img: PHOTOS.bad2, text: "Conejos", type: 'bad' },
            { img: PHOTOS.bad3, text: "Popo", type: 'bad' }
          ];

          useEffect(() => {
            if (completed) return;
            const spawnInterval = setInterval(() => {
              const isBad = Math.random() < 0.35;
              const arr = isBad ? badItemsDef : goodItemsDef;
              const def = arr[Math.floor(Math.random() * arr.length)];
              
              setFloatingItems(prev => [...prev, {
                id: Date.now() + Math.random(),
                ...def,
                x: randomRange(10, 80),
                y: -20, 
                speed: randomRange(2.5, 5.5) 
              }]);
            }, 350); 

            const moveInterval = setInterval(() => {
              setFloatingItems(prev => prev.map(item => ({
                ...item,
                y: item.y + item.speed
              })).filter(item => item.y < 120)); 
            }, 20);

            return () => {
              clearInterval(spawnInterval);
              clearInterval(moveInterval);
            };
          }, [completed]);

          const handleTap = (id, type) => {
            if (completed) return;
            setFloatingItems(prev => prev.filter(item => item.id !== id));
            
            setFill(prev => {
              if (type === 'bad') {
                  setShake(true);
                  setTimeout(() => setShake(false), 400);
                  return Math.max(0, prev - 15); 
              } else {
                  const next = prev + 5; 
                  if (next >= 100) {
                    setCompleted(true);
                    setTimeout(onWin, 4000);
                  }
                  return next;
              }
            });
          };

          return (
             <div className="h-full w-full bg-gradient-to-br from-blue-950 to-indigo-950 relative overflow-hidden flex flex-col items-center justify-center select-none">
               
               {shake && <div className="absolute inset-0 bg-red-600/30 z-40 pointer-events-none animate-pulse" />}

               <div className="absolute top-12 landscape:top-4 text-center z-20 px-4 pointer-events-none">
                 <h2 className="text-3xl landscape:text-xl font-black text-yellow-200 drop-shadow-md mb-2 landscape:mb-1">Llena nuestro corazón</h2>
                 <p className="text-sm landscape:text-xs text-yellow-300 font-medium">Atrapa lo que es tuff❤️‍🩹</p>
               </div>

               <motion.div 
                  className="relative w-64 h-64 landscape:w-40 landscape:h-40 flex items-center justify-center mt-12 landscape:mt-8 pointer-events-none"
                  animate={shake ? { x: [-10, 10, -10, 10, 0] } : {}}
                  transition={{ duration: 0.4 }}
               >
                  <i className="fa-solid fa-heart text-[14rem] landscape:text-[10rem] text-white/10 absolute top-0 left-0 right-0 bottom-0 text-center leading-[16rem] landscape:leading-[10rem]"></i>
                  
                  <motion.i 
                    className="fa-solid fa-heart text-blue-500 absolute top-0 left-0 right-0 bottom-0 text-center leading-[16rem] landscape:leading-[10rem] text-[14rem] landscape:text-[10rem]"
                    animate={{ 
                      scale: 0.5 + (Math.min(fill, 100) / 200),
                      opacity: 0.2 + (Math.min(fill, 100) / 125)
                    }}
                    transition={{ type: "spring", bounce: 0.4 }}
                    style={{ filter: `drop-shadow(0 0 ${fill / 2}px rgba(59,130,246,1))` }}
                  />
                  
                  <span className="absolute z-20 font-black text-white text-3xl landscape:text-xl mix-blend-overlay drop-shadow-lg">
                    {Math.min(fill, 100)}%
                  </span>
               </motion.div>

               <AnimatePresence>
                 {!completed && floatingItems.map(item => (
                   <motion.div
                     key={item.id}
                     initial={{ opacity: 0, scale: 0.5 }}
                     animate={{ opacity: 1, scale: 1 }}
                     exit={{ opacity: 0, scale: 0 }} 
                     transition={{ duration: 0.2 }}
                     onMouseDown={() => handleTap(item.id, item.type)}
                     onTouchStart={(e) => { e.preventDefault(); handleTap(item.id, item.type); }}
                     className={`absolute flex flex-col items-center justify-center p-2 cursor-pointer bg-white/10 backdrop-blur-md rounded-2xl border-[3px] z-30 ${
                       item.type === 'bad' 
                         ? 'border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.5)]' 
                         : 'border-yellow-400 shadow-[0_0_20px_rgba(250,204,21,0.5)]'
                     }`}
                     style={{ left: `${item.x}%`, top: `${item.y}%` }}
                     whileTap={{ scale: 0.8 }}
                   >
                      <img src={item.img} className={`w-16 h-16 md:w-20 md:h-20 landscape:w-12 landscape:h-12 object-cover rounded-xl mb-1 shadow-inner pointer-events-none ${item.type === 'bad' ? 'grayscale' : ''}`} alt="recuerdo" />
                      <span className={`text-[10px] md:text-xs landscape:text-[8px] font-bold uppercase tracking-wider pointer-events-none ${item.type === 'bad' ? 'text-red-200' : 'text-yellow-100'}`}>
                        {item.text}
                      </span>
                   </motion.div>
                 ))}
               </AnimatePresence>

               <AnimatePresence>
                 {completed && (
                   <motion.div 
                      initial={{ opacity: 0, scale: 0 }} 
                      animate={{ opacity: 1, scale: [0, 1.2, 1] }} 
                      transition={{ type: "spring", duration: 1 }}
                      className="absolute inset-0 flex items-center justify-center z-40 bg-blue-950/90 backdrop-blur-sm"
                   >
                      <div className="text-center p-6 pointer-events-none">
                         <i className="fa-solid fa-heart text-9xl landscape:text-7xl text-yellow-400 drop-shadow-[0_0_60px_rgba(250,204,21,1)] animate-bounce mb-8 landscape:mb-4"></i>
                         <h1 className="text-4xl md:text-6xl landscape:text-3xl font-black text-white mb-4 landscape:mb-2 leading-tight">¡CORAZÓN<br/>LLENO!</h1>
                         <p className="text-xl landscape:text-sm text-yellow-200 font-medium">La mezcla perfecta ❤️‍🩹❤️‍🩹</p>
                      </div>
                   </motion.div>
                 )}
               </AnimatePresence>
             </div>
          )
        };

        // PANTALLA FINAL
        const FinalScreen = ({ onRestart }) => (
          <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} className="h-full w-full bg-slate-950 flex flex-col items-center justify-center p-4 overflow-hidden relative select-none">
            <div className="absolute inset-0 opacity-30" style={{ backgroundImage: 'radial-gradient(#ffffff 1px, transparent 1px)', backgroundSize: '20px 20px' }} />
            <motion.div animate={{ rotate: [0, 2, -2, 0] }} transition={{ repeat: Infinity, duration: 4 }} className="z-10 bg-zinc-900 border-[3px] border-blue-500 rounded-3xl p-2 shadow-[0_0_40px_rgba(59,130,246,0.3)] max-w-sm landscape:max-w-2xl w-full rotate-1">
              <div className="bg-slate-950 rounded-2xl p-8 landscape:p-6 flex flex-col landscape:flex-row items-center justify-center text-center landscape:text-left space-y-6 landscape:space-y-0 landscape:gap-6 border border-white/5">
                <div className="w-40 h-40 landscape:w-28 landscape:h-28 bg-black overflow-hidden border-[4px] border-blue-500 rounded-full shadow-[0_0_30px_rgba(59,130,246,0.5)] shrink-0">
                    <img src={PHOTOS.avatar} className="w-full h-full object-cover" style={{ imageRendering: 'pixelated' }} />
                </div>
                <div className="flex flex-col items-center landscape:items-start w-full">
                  <h1 className="text-4xl landscape:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-yellow-400 uppercase tracking-tighter drop-shadow-sm mb-2">HERMOSOSOSOSOSOSAAAAA<br/>LÍA</h1>
                  <p className="font-bold text-blue-200 leading-relaxed text-xl landscape:text-base italic w-full text-center">
                    "Esto lo hice por y para ti. Espero que te haya gustado y que hayas disfrutado cada parte tanto como yo disfruté haciéndola. Gracias por ser tan increíble, por tu sonrisa, tu risa, tu compañía y por ser tú. Eres la mejor cosa que me ha pasado y no puedo esperar para seguir creando recuerdos juntos. Te AMOOOOOO muchísimo, Lía Ameeran. De: Isaac."
                  </p>
                </div>
              </div>
            </motion.div>
            <motion.button whileHover={{ scale: 1.05 }} onClick={onRestart} className="mt-12 landscape:mt-6 z-10 flex items-center gap-2 bg-blue-600 text-white font-bold py-4 px-8 landscape:py-3 landscape:px-6 rounded-2xl shadow-[0_0_20px_rgba(37,99,235,0.5)] active:scale-95 transition-all">
              <RefreshCcw size={20} /> VOLVER A JUGAR
            </motion.button>
          </motion.div>
        );

        // --- APP CONTROLLER ---
        function App() {
          const [stage, setStage] = useState('start'); 
          const [isFullscreen, setIsFullscreen] = useState(false);

          const handleStart = () => {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
              elem.requestFullscreen().catch(e => console.log(e));
            } else if (elem.webkitRequestFullscreen) {
              elem.webkitRequestFullscreen().catch(e => console.log(e));
            }
            
            try {
               if (window.screen.orientation && window.screen.orientation.lock) {
                  window.screen.orientation.lock('landscape').catch(e => console.log(e));
               }
            } catch(e) {}

            setIsFullscreen(true);
            setStage('intro');
          };

          const introSlides = [
            { text: "Hola Lía Ameeran, esto es por y para tiii :D" },
            { text: "Dame un 5000 pbesos...", sub: "jijijiji " }
          ];

          const quizIntroSlides = [
            { text: "Antes que todo..." },
            { text: "Vamos a probar ese cerebro tuyo 🧠", img: PHOTOS.random },
            { text: "A ver qué tan despierta estás 👀👀👀" }
          ];

          const runnerIntroSlides = [
            { text: "Nada mal ehhh" },
            { text: "Ahora sí..." },
            { text: "A ver qué tal tus reflejos" },
            { text: "Desliza para no morir" },
            { text: "15 segundos porque es lo que duro yo (estudiando)🥀🥀🥀" }
          ];

          const plantIntroSlides = [
            { text: "Sabía que necesitarías ayuda...", sub: "Eres muuuuuy malaaaa 👎🏻" },
            { text: "Probemos algo más fácil..." },
            { text: "Cuida esta planta porfavor, es de mi primo :D" }
          ];

          const shrimpIntroSlides = [
            { text: "Acaba de pasar algo terrible..." },
            { text: "En una marisquería se revelaron los camarones del lugar", img: PHOTOS.shrimp },
            { text: "¡Acaba con los camarones mutantes malvados!" },
            { text: "Sobrevive 3 rondas" }
          ];

          const antarcticaIntroSlides = [
            { text: "Sé muy bien que tu juego favorito en Roblox es Expedition Antarctica..." },
            { text: "Así que te preparé algo especial ❄️", img: PHOTOS.antarctica_bg },
            { text: "Salta por las plataformas de hielo hasta llegar a los 10,000 metros" },
            { text: "¡Y ten cuidado con la tormenta de hielo!" }
          ];

          const loveIntroSlides = [
            { text: "Después de sobrevivir a la antártida... " },
            { text: "Toca armar algo pipirisnais 💖", sub: "Es hora de ponernos románticos jejejejejej" },
            { text: "A ver qué tan buena eres para esto, si fallas... eh... no sé... ijijijiijiji" }
          ];
          
          return (
            <div className="fixed inset-0 bg-black text-white font-sans overflow-hidden select-none">
              <CRTEffect />
              <AnimatePresence mode="wait">
                
                {stage === 'start' && (
                  <motion.div 
                    key="start" 
                    className="h-full w-full flex flex-col items-center justify-center bg-[#050505] relative z-50"
                    exit={{ opacity: 0 }}
                  >
                     <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(59,130,246,0.15),transparent_70%)] pointer-events-none" />
                     <motion.button 
                       onClick={handleStart}
                       whileHover={{ scale: 1.05 }}
                       whileTap={{ scale: 0.95 }}
                       className="bg-blue-600 border-[3px] border-blue-400 text-white font-black text-2xl md:text-4xl py-5 px-12 rounded-3xl shadow-[0_0_40px_rgba(59,130,246,0.6)] animate-pulse tracking-wide"
                     >
                        Empezar
                     </motion.button>
                  </motion.div>
                )}

                {stage === 'intro' && <SlideSequence key="intro" slides={introSlides} onComplete={() => setStage('quiz_intro')} />}
                
                {stage === 'quiz_intro' && <SlideSequence key="quiz_intro" slides={quizIntroSlides} onComplete={() => setStage('game_quiz')} />}
                {stage === 'game_quiz' && <DuolingoQuiz key="game_quiz" onWin={() => setStage('runner_intro')} />}

                {stage === 'runner_intro' && <SlideSequence key="runner_intro" slides={runnerIntroSlides} onComplete={() => setStage('game1')} />}
                {stage === 'game1' && (
                  <div key="game1" className="h-full w-full">
                     <motion.div initial={{opacity: 1}} animate={{opacity: 0}} transition={{delay: 2, duration: 0.5}} className="absolute inset-0 z-40 bg-black/80 flex items-center justify-center pointer-events-none"><h1 className="text-4xl text-blue-400 font-black tracking-widest drop-shadow-lg">DESLIZA</h1></motion.div>
                     <CyberRunner onWin={() => setStage('plant_intro')} />
                  </div>
                )}
                
                {stage === 'plant_intro' && <SlideSequence key="plant_intro" slides={plantIntroSlides} onComplete={() => setStage('game_plant')} />}
                {stage === 'game_plant' && (
                  <PlantGame key="game_plant" onWin={() => setStage('shrimp_intro')} onKill={() => setStage('shrimp_intro')} />
                )}

                {stage === 'shrimp_intro' && <SlideSequence key="shrimp_intro" slides={shrimpIntroSlides} onComplete={() => setStage('game_shrimp')} />}
                {stage === 'game_shrimp' && <ShrimpGame key="game_shrimp" onWin={() => setStage('antarctica_intro')} />}
                
                {stage === 'antarctica_intro' && <SlideSequence key="antarctica_intro" slides={antarcticaIntroSlides} onComplete={() => setStage('game_antarctica')} />}
                {stage === 'game_antarctica' && <AntarcticaGame key="game_antarctica" onWin={() => setStage('love_intro')} />}

                {stage === 'love_intro' && <SlideSequence key="love_intro" slides={loveIntroSlides} onComplete={() => setStage('game_love')} />}
                {stage === 'game_love' && <LoveHeartGame key="game_love" onWin={() => setStage('final_screen')} />}

                {stage === 'final_screen' && <FinalScreen key="final" onRestart={() => setStage('start')} />}
              </AnimatePresence>
              <div className="fixed bottom-2 right-2 text-[10px] text-zinc-700 font-mono z-50 opacity-50 pointer-events-none">holiwis kiwi</div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
