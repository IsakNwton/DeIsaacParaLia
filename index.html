<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Para Lía Ameeran 💖</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Outfit', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'monospace'],
            }
          }
        }
      }
    </script>

    <!-- FontAwesome para los iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617; /* Fondo azul muy oscuro */
            touch-action: none;
        }
        #root {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion;
        
        // --- ADAPTADOR DE ICONOS ---
        const IconWrapper = ({ icon, size = 24, className = "" }) => (
          <i className={`fa-solid ${icon} ${className}`} style={{ fontSize: size }}></i>
        );

        const Heart = (props) => <IconWrapper icon="fa-heart" {...props} />;
        const Skull = (props) => <IconWrapper icon="fa-skull" {...props} />;
        const Zap = (props) => <IconWrapper icon="fa-bolt" {...props} />;
        const RefreshCcw = (props) => <IconWrapper icon="fa-arrows-rotate" {...props} />;
        const Ghost = (props) => <IconWrapper icon="fa-ghost" {...props} />;
        const Cpu = (props) => <IconWrapper icon="fa-microchip" {...props} />;
        const Brain = (props) => <IconWrapper icon="fa-brain" {...props} />;
        const ArrowRight = (props) => <IconWrapper icon="fa-arrow-right" {...props} />;
        const ArrowLeft = (props) => <IconWrapper icon="fa-arrow-left" {...props} />;
        const ArrowUp = (props) => <IconWrapper icon="fa-arrow-up" {...props} />;
        const Sparkles = (props) => <IconWrapper icon="fa-wand-magic-sparkles" {...props} />;
        const Shield = (props) => <IconWrapper icon="fa-shield-halved" {...props} />;
        const Utensils = (props) => <IconWrapper icon="fa-utensils" {...props} />;
        const FlaskConical = (props) => <IconWrapper icon="fa-flask" {...props} />;
        const Bath = (props) => <IconWrapper icon="fa-bath" {...props} />;
        const Sofa = (props) => <IconWrapper icon="fa-couch" {...props} />;
        const Droplets = (props) => <IconWrapper icon="fa-droplet" {...props} />;
        const Hand = (props) => <IconWrapper icon="fa-hand" {...props} />;
        const Crosshair = (props) => <IconWrapper icon="fa-crosshairs" {...props} />;
        const Target = (props) => <IconWrapper icon="fa-bullseye" {...props} />;
        const Bomb = (props) => <IconWrapper icon="fa-bomb" {...props} />;
        const Activity = (props) => <IconWrapper icon="fa-chart-line" {...props} />;
        const Package = (props) => <IconWrapper icon="fa-box" {...props} />;
        const RotateCw = (props) => <IconWrapper icon="fa-rotate-right" {...props} />;
        const AlertTriangle = (props) => <IconWrapper icon="fa-triangle-exclamation" {...props} />;

        // --- ASSETS & CONFIG ---
        // Pega aquí tus enlaces de Imgur o donde hayas subido tus imágenes
        const PHOTOS = {
          avatar: "https://i.imgur.com/BEA1Jwg.jpeg", 
          shrimp: "https://puntodelmar.com.mx/wp-content/uploads/2018/03/camaronmacuil.jpg",
          apocalypse_bg: "https://www.revistaabogacia.com/wp-content/uploads/2022/01/Gastronomia-Los-Arcos-1068x499.jpg",
          antarctica_bg: "https://tr.rbxcdn.com/180DAY-2d4e531ed035acccabd2f1a64404f8cb/500/280/Image/Jpeg/noFilter", 
          antarctica_bgr3: "https://images.unsplash.com/photo-1548550023-2bf3c49b3420?auto=format&fit=crop&w=1000&q=80",
          plant: "https://images.unsplash.com/photo-1485955900006-10f4d324d411?auto=format&fit=crop&w=500&q=80",
          gun: "https://armas1000.cl/wp-content/uploads/2025/01/EC9459B-3D.webp",
          random: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRG6gl_vXeHIhk5ROr4pPzCRKKZuKbVVkpl9A&s",
          
          // Fotos para el Quiz
          quiz1: "https://voca-land.sgp1.cdn.digitaloceanspaces.com/43844/1655520547415/a75e6b54b0eb6c50c98a722511d11073578a8f4f2fac3d48e9eaacec627d6a4c.jpg",
          quiz2: "https://i.pinimg.com/736x/00/82/f1/0082f13303a71cbd956a47602911da57.jpg",
          quiz3: "https://i.pinimg.com/1200x/b0/8e/a6/b08ea69ef3e72e937c32b52022456e41.jpg", 
          quiz4: "https://i.imgur.com/fojRaTT.jpeg", 
          quiz5: "https://i.pinimg.com/236x/75/27/c0/7527c06a69446a43d937142942cd0119.jpg", 
          quiz6: "https://cdn.prod.website-files.com/662fb92f905585b61b12afd8/683941caf4bec9ae3a5c6992_e0aa3a83d800a52d6068135517a6ff0d_Birthday_V01_004%201.webp",
          quiz7: "https://images7.memedroid.com/images/UPLOADED545/5fd39dcc4f2c2.jpeg",
          quiz8: "https://thumbs.dreamstime.com/b/gota-de-sangre-con-los-pulgares-para-arriba-53667568.jpg",
          shawarma: "https://cusiworld.com/wp-content/uploads/2024/05/shawarma-de-pollo-cusi-1200x675.jpeg",
          nahla: "https://i.imgur.com/Ga3zGMS.jpeg",
          
          good3: "https://shapes.inc/api/public/avatar/mangomemesbot",  
          good4: "https://assets.newsweek.com/wp-content/uploads/2025/10/67.png?w=1600&quality=80&webp=1",
          
          // Lo que NO le gusta a Lía
          bad1: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTSPWEa__2AmQVW6o3QBRB6cxX0dW3QWCtCJQ&s", 
          bad2: "https://static.nationalgeographicla.com/files/styles/image_3200/public/coelho-domestico-ng.JPG.webp?w=1600&h=1056", 
          bad3: "https://media.istockphoto.com/id/2220888331/es/vector/icono-de-mierda-cara-sonriente-s%C3%ADmbolo-emoji-vector-10-eps.jpg?s=612x612&w=0&k=20&c=umxprUDxLOejsBohOV3jD0eB-izR1CK2cMmShgWbWI0="  
        };

        const randomRange = (min, max) => Math.random() * (max - min) + min;

        // --- EFECTOS VISUALES ---
        const CRTEffect = () => (
          <div className="pointer-events-none fixed inset-0 z-50 overflow-hidden h-full w-full">
            <div className="absolute inset-0 bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(59,130,246,0.06),rgba(234,179,8,0.02),rgba(14,165,233,0.06))] z-50 bg-[length:100%_2px,3px_100%] pointer-events-none"></div>
            <div className="absolute inset-0 bg-[radial-gradient(circle,rgba(0,0,0,0)_50%,rgba(0,0,0,0.8)_100%)] z-40"></div>
          </div>
        );

        const TotemOverlay = () => (
          <div className="absolute inset-0 z-50 flex items-center justify-center pointer-events-none overflow-hidden">
            <motion.div 
              initial={{ opacity: 0 }}
              animate={{ opacity: [0, 0.8, 0] }}
              transition={{ duration: 0.5 }}
              className="absolute inset-0 bg-yellow-400 mix-blend-hard-light"
            />
            <motion.div
              initial={{ scale: 0.5, y: 100, opacity: 0 }}
              animate={{ scale: [0.5, 1.2, 1.5], y: [100, 0, -100], opacity: [0, 1, 0] }}
              transition={{ duration: 1.5, ease: "easeOut" }}
              className="text-9xl landscape:text-7xl drop-shadow-[0_0_30px_rgba(250,204,21,1)] filter brightness-110"
            >
              🗿
            </motion.div>
          </div>
        );

        const ResurrectionOverlay = () => (
          <div className="absolute inset-0 z-50 flex items-center justify-center pointer-events-none overflow-hidden">
            <motion.div 
              initial={{ opacity: 0 }}
              animate={{ opacity: [0, 0.9, 0] }}
              transition={{ duration: 0.8 }}
              className="absolute inset-0 bg-blue-600 mix-blend-multiply"
            />
            <motion.div
              initial={{ scale: 0.2, opacity: 0 }}
              animate={{ 
                scale: [0.2, 1.5, 2], 
                opacity: [0, 1, 0],
                rotate: [0, -10, 10, -10, 0]
              }}
              transition={{ duration: 1.5, ease: "circOut" }}
              className="text-9xl landscape:text-7xl relative z-10 drop-shadow-[0_0_50px_rgba(59,130,246,1)]"
            >
              🗿
            </motion.div>
            <motion.div
              initial={{ y: 50, opacity: 0 }}
              animate={{ y: 0, opacity: [0, 1, 0] }}
              transition={{ delay: 0.2, duration: 1.5 }}
              className="absolute bottom-1/4 landscape:bottom-10 text-4xl landscape:text-2xl font-black text-blue-400 tracking-widest uppercase drop-shadow-lg"
            >
              RESURRECCIÓN
            </motion.div>
          </div>
        );

        const DeathOverlay = () => (
          <div className="absolute inset-0 z-50 flex items-center justify-center pointer-events-none overflow-hidden bg-black/50">
            <motion.div 
              initial={{ opacity: 0 }}
              animate={{ opacity: [0, 0.8, 0.4, 0.9], x: [-20, 20, -10, 10, 0] }}
              transition={{ duration: 0.8 }}
              className="absolute inset-0 bg-red-700 mix-blend-multiply"
            />
          </div>
        );

        // --- COMPONENTES UI ---
        const SlideSequence = ({ slides, onComplete }) => {
          const [slide, setSlide] = useState(0);

          useEffect(() => {
            const currentDuration = slides[slide]?.duration || 4000;
            if (slide < slides.length) {
              const timer = setTimeout(() => {
                setSlide(s => s + 1);
              }, currentDuration);
              return () => clearTimeout(timer);
            } else {
              onComplete();
            }
          }, [slide, onComplete, slides]);

          const nextSlide = () => setSlide(s => s + 1);

          return (
            <div className="h-full w-full flex flex-col items-center justify-center bg-slate-950 text-center p-6 relative overflow-hidden cursor-pointer select-none" onClick={nextSlide}>
              <AnimatePresence mode="wait">
                {slide < slides.length && (
                  <motion.div
                    key={slide}
                    initial={{ opacity: 0, scale: 0.9, y: 20, rotate: -2 }}
                    animate={{ opacity: 1, scale: 1, y: 0, rotate: 0 }}
                    exit={{ opacity: 0, scale: 1.1, y: -20, rotate: 2 }}
                    transition={{ duration: 0.5 }}
                    className="flex flex-col items-center gap-6 landscape:gap-3 max-w-md z-10"
                  >
                    {slides[slide].img && (
                      <motion.div 
                        className={`overflow-hidden border-[3px] border-blue-500 rounded-3xl shadow-[0_0_40px_rgba(59,130,246,0.5)] bg-zinc-900 shrink-0`}
                        initial={{ scale: 0 }}
                        animate={{ scale: 1, rotate: [0, -2, 2, 0] }}
                      >
                        <img src={slides[slide].img} className={`object-cover w-64 h-48 md:w-80 md:h-64 landscape:w-48 landscape:h-32`} alt="Slide visual" />
                      </motion.div>
                    )}
                    <h1 className="text-3xl md:text-5xl landscape:text-2xl font-black bg-clip-text text-transparent bg-gradient-to-br from-blue-300 via-yellow-200 to-amber-300 leading-tight drop-shadow-2xl whitespace-pre-wrap">
                      {slides[slide].text}
                    </h1>
                    {slides[slide].sub && (
                      <p className="text-blue-300 text-lg landscape:text-base font-bold italic animate-pulse">
                        {slides[slide].sub}
                      </p>
                    )}
                  </motion.div>
                )}
              </AnimatePresence>
              <div className="absolute inset-0 z-0 opacity-40 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-blue-900/40 via-black to-black" />
              <div className="absolute bottom-10 text-zinc-500 text-xs animate-bounce font-mono">Toca para saltar</div>
            </div>
          );
        };

        const RetryScreen = ({ onRetry, message = "¡No te rindas, Lía!" }) => (
          <motion.div 
            initial={{ opacity: 0, scale: 1.1 }}
            animate={{ opacity: 1, scale: 1 }}
            className="absolute inset-0 z-50 bg-black/90 flex flex-col items-center justify-center space-y-6 text-center p-4"
          >
            <div className="absolute inset-0 bg-red-900/20 animate-pulse pointer-events-none" />
            <motion.h2 
              initial={{ y: -50 }} animate={{ y: 0 }} 
              className="text-red-600 font-black text-6xl md:text-8xl landscape:text-5xl tracking-tighter drop-shadow-[0_0_20px_rgba(220,38,38,0.8)]"
            >
              FAIL
            </motion.h2>
            <p className="text-zinc-300 font-medium text-lg max-w-xs z-10 relative">{message}</p>
            <motion.button 
              whileHover={{ scale: 1.1 }}
              whileTap={{ scale: 0.9 }}
              onClick={onRetry}
              className="bg-white text-black font-black py-3 px-8 landscape:py-2 landscape:px-6 rounded-full text-xl landscape:text-lg shadow-[0_0_20px_rgba(255,255,255,0.5)] flex items-center gap-2 z-10 relative"
            >
              <RefreshCcw size={24} /> INTENTAR DE NUEVO
            </motion.button>
          </motion.div>
        );

        // --- JUEGOS ---

        // JUEGO 0: DUOLINGO QUIZ
        const DuolingoQuiz = ({ onWin }) => {
          const QUESTIONS = [
            {
              id: 1,
              img: PHOTOS.quiz1,
              text: "¿Quién es la persona más hermosa del mundo?",
              options: ["Tú, Lía Ameeran", "Poncerringo", "Yo, André Isaac", "El director"],
              correct: 0
            },
            {
              id: 2,
              img: PHOTOS.quiz2,
              text: "¿Cuál de estas comidas prepararía si tienes mucha hambre?",
              options: ["Hamburguesa", "Shawarma", "Tacos al pastor", "Pizza con piña"],
              correct: 1
            },
            {
              id: 3,
              img: PHOTOS.quiz3,
              text: "¿A cuántos países en total has viajado en tu vida?",
              options: ["10 países", "12 países", "16 países", "20 países"],
              correct: 2
            },
            {
              id: 4,
              img: PHOTOS.quiz4,
              text: "¿Cómo se llaman los integrantes de 5 Seconds of Summer (5SOS)?",
              options: ["Harry, Liam, Zayn, Niall", "Luke, Calum, Ashton, Michael", "Kendall, Logan, Carlos, James", "Joe, Kevin, Nick, Frankie"],
              correct: 1
            },
            {
              id: 5,
              img: PHOTOS.quiz5,
              text: "¿Cómo se llama el icónico álbum de Taylor Swift que marcó su transición completa al pop (y el año de su nacimiento)?",
              options: ["Red", "Speak Now", "Reputation", "1989"],
              correct: 3
            },
            {
              id: 6,
              img: PHOTOS.quiz6,
              text: "¿En qué fecha exacta nació el guaporongo de tu novio?",
              options: ["27 de Enero de 2010", "15 de Febrero de 2009", "27 de Febrero de 2010", "12 de Enero de 2011"],
              correct: 0
            },
            {
              id: 7,
              img: PHOTOS.quiz7,
              text: "¿Cuál de estás comidas preferiría comer YO si fuese a comer eso por 2 meses seguidos?",
              options: ["Pizza con pepperoni", "Tacos al pastor", "Espaguetti", "Hamburguesa doble"],
              correct: 1
            },
            {
              id: 8,
              img: PHOTOS.quiz8,
              text: "¿Cuál es mi tipo de sangre?",
              options: ["O Negativo", "A Positivo", "B Positivo", "AB Negativo"],
              correct: 1
            }
          ];

          const [currentQ, setCurrentQ] = useState(0);
          const [selected, setSelected] = useState(null);
          const [status, setStatus] = useState('idle');
          const [hearts, setHearts] = useState(5);
          const [failed, setFailed] = useState(false);

          const question = QUESTIONS[currentQ];

          const handleCheck = () => {
            if (selected === null) return;
            if (selected === question.correct) {
              setStatus('correct');
            } else {
              setStatus('wrong');
              const newHearts = hearts - 1;
              setHearts(newHearts);
              if (newHearts <= 0) {
                setTimeout(() => setFailed(true), 1200);
              }
            }
          };

          const handleNext = () => {
            if (status === 'correct') {
              if (currentQ < QUESTIONS.length - 1) {
                setCurrentQ(c => c + 1);
                setSelected(null);
                setStatus('idle');
              } else {
                onWin();
              }
            } else {
              setSelected(null);
              setStatus('idle');
            }
          };

          const resetGame = () => {
            setHearts(5);
            setCurrentQ(0);
            setSelected(null);
            setStatus('idle');
            setFailed(false);
          };

          return (
            <div className="h-full w-full relative bg-slate-950 flex flex-col items-center select-none overflow-hidden">
              
              {failed && <RetryScreen onRetry={resetGame} message="¡Te quedaste sin vidas! Hay que repasar esos datos, Lía." />}

              <div className="w-full max-w-4xl px-6 pt-6 landscape:pt-4 pb-2 flex items-center gap-4 shrink-0">
                <i className="fa-solid fa-xmark text-zinc-600 text-xl"></i>
                <div className="flex-1 h-4 bg-zinc-800 rounded-full overflow-hidden">
                   <motion.div 
                     className="h-full bg-blue-500 rounded-full shadow-[0_0_10px_rgba(59,130,246,0.8)]"
                     initial={{ width: `${(currentQ / QUESTIONS.length) * 100}%` }}
                     animate={{ width: `${((currentQ + (status === 'correct' ? 1 : 0)) / QUESTIONS.length) * 100}%` }}
                   />
                </div>
                <div className="flex items-center gap-1 text-rose-500 font-bold">
                  <i className="fa-solid fa-heart"></i> {hearts}
                </div>
              </div>

              <div className="flex-1 w-full max-w-4xl px-6 flex flex-col landscape:flex-row pt-2 pb-4 overflow-y-auto landscape:overflow-y-visible gap-4 landscape:items-center">
                
                <div className="flex flex-col items-center justify-center w-full landscape:w-1/2 shrink-0 h-full">
                  <h2 className="text-xl md:text-2xl landscape:text-lg font-bold text-white mb-4 whitespace-pre-wrap leading-tight text-center">{question.text}</h2>
                  <div className="w-full flex justify-center mb-6 landscape:mb-0 shrink-0">
                    <div className="w-32 h-32 md:w-48 md:h-48 landscape:w-32 landscape:h-32 bg-zinc-800 rounded-3xl overflow-hidden border-[3px] border-zinc-700 shadow-2xl">
                      <img src={question.img} className="w-full h-full object-cover" alt="Referencia" />
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 gap-3 w-full landscape:w-1/2 mt-auto landscape:mt-0 shrink-0 landscape:self-center">
                  {question.options.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => status === 'idle' && setSelected(i)}
                      className={`relative w-full p-3 md:p-4 landscape:p-2 rounded-2xl border-2 text-left font-bold text-base md:text-lg landscape:text-sm transition-all duration-200 transform active:translate-y-1 ${
                        selected === i 
                          ? 'bg-blue-900/40 border-blue-400 text-blue-300' 
                          : 'bg-zinc-900/50 border-zinc-700 text-white hover:bg-zinc-800'
                      }`}
                      style={{ 
                        borderBottomWidth: selected === i ? '2px' : '4px',
                        transform: selected === i ? 'translateY(2px)' : 'none'
                      }}
                    >
                      {opt}
                    </button>
                  ))}
                </div>
              </div>

              <div className={`w-full max-w-4xl p-4 landscape:p-3 shrink-0 border-t-2 transition-colors duration-300 ${
                status === 'idle' ? 'border-zinc-800 bg-slate-950' : 
                status === 'correct' ? 'border-emerald-500 bg-emerald-950/80' : 'border-rose-500 bg-rose-950/80'
              }`}>
                <div className="flex flex-col landscape:flex-row items-center justify-between gap-4">
                  <div className="flex items-center w-full landscape:w-auto justify-start">
                    {status === 'correct' && (
                      <div className="flex items-center gap-3 text-emerald-400 font-bold text-xl landscape:text-lg">
                        <div className="w-8 h-8 rounded-full bg-emerald-500 text-white flex items-center justify-center"><i className="fa-solid fa-check"></i></div>
                        ¡Perfectooooo, Lía!
                      </div>
                    )}
                    {status === 'wrong' && (
                      <div className="flex items-center gap-3 text-rose-400 font-bold text-xl landscape:text-lg">
                        <div className="w-8 h-8 rounded-full bg-rose-500 text-white flex items-center justify-center"><i className="fa-solid fa-xmark"></i></div>
                        Nooo, intenta de nuevo. (-1 ❤️)
                      </div>
                    )}
                  </div>
                  
                  <div className="w-full landscape:w-1/3">
                    {status === 'idle' ? (
                      <button 
                        onClick={handleCheck}
                        disabled={selected === null}
                        className={`w-full py-4 landscape:py-3 rounded-2xl font-black text-lg landscape:text-base uppercase tracking-wider transition-all border-b-[4px] active:border-b-0 active:translate-y-1 ${
                          selected !== null 
                            ? 'bg-blue-600 border-blue-800 text-white hover:bg-blue-500 shadow-[0_0_20px_rgba(59,130,246,0.4)]' 
                            : 'bg-zinc-800 border-zinc-900 text-zinc-600 cursor-not-allowed'
                        }`}
                      >
                        COMPROBAR
                      </button>
                    ) : (
                      <button 
                        onClick={handleNext}
                        className={`w-full py-4 landscape:py-3 rounded-2xl font-black text-lg landscape:text-base uppercase tracking-wider transition-all border-b-[4px] active:border-b-0 active:translate-y-1 ${
                          status === 'correct'
                            ? 'bg-emerald-500 border-emerald-700 text-white shadow-[0_0_20px_rgba(16,185,129,0.4)]'
                            : 'bg-rose-500 border-rose-700 text-white shadow-[0_0_20px_rgba(244,63,94,0.4)]'
                        }`}
                      >
                        CONTINUAR
                      </button>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        // JUEGO 1: CYBER RUNNER
        const CyberRunner = ({ onWin }) => {
          const [playerX, setPlayerX] = useState(50);
          const [playerY, setPlayerY] = useState(80);
          const [obstacles, setObstacles] = useState([]);
          const [timeLeft, setTimeLeft] = useState(15);
          const [health, setHealth] = useState(100);
          const [failed, setFailed] = useState(false);
          const [gameWon, setGameWon] = useState(false);
          const [totemActive, setTotemActive] = useState(false);
          const [isInvincible, setIsInvincible] = useState(false);
          
          const containerRef = useRef(null);
          const reqRef = useRef();
          
          const resetGame = () => {
            setTimeLeft(15);
            setObstacles([]);
            setHealth(100);
            setFailed(false);
            setGameWon(false);
            setPlayerX(50);
            setPlayerY(80);
            setTotemActive(false);
            setIsInvincible(false);
          };

          useEffect(() => {
            if (failed || gameWon) return;
            const timer = setInterval(() => {
              setTimeLeft(prev => {
                if (prev <= 1) {
                   setGameWon(true);
                   setTimeout(onWin, 500);
                   return 0;
                }
                return prev - 1;
              });
            }, 1000);
            return () => clearInterval(timer);
          }, [failed, gameWon, onWin]);

          const update = useCallback(() => {
            if (failed || gameWon) return;
            const timeElapsed = 15 - timeLeft;
            
            const baseSpeed = 0.8 + (timeElapsed * 0.04); 

            setObstacles(prev => {
              let newObstacles = [];
              let currentHealth = health;

              prev.forEach(ob => {
                let nextY = ob.y + (ob.speedY !== undefined ? ob.speedY : baseSpeed);
                let nextX = ob.x + (ob.speedX || 0);

                if (ob.type === 'ghost' && nextY > 95 && timeLeft <= 10) {
                  for(let i=0; i<3; i++) {
                     newObstacles.push({ id: Date.now() + Math.random(), x: ob.x, y: 95, type: 'fragment', speedY: -randomRange(0.5, 1.5), speedX: randomRange(-1, 1) });
                  }
                  return; 
                }

                if (nextY > 105 || nextY < -10 || nextX < 0 || nextX > 100) return;

                const hitboxX = ob.type === 'ghost' ? 5 : 3; 
                const hitboxY = ob.type === 'ghost' ? 8 : 4; 
                const isHit = Math.abs(nextY - playerY) < hitboxY && Math.abs(nextX - playerX) < hitboxX;

                if (isHit) {
                  if (!isInvincible) currentHealth -= (ob.type === 'ghost' ? 34 : 15);
                } else {
                  newObstacles.push({ ...ob, x: nextX, y: nextY });
                }
              });

              if (currentHealth <= 0) {
                  if (!totemActive && !isInvincible) {
                     setTotemActive(true);
                     setIsInvincible(true);
                     currentHealth = 100;
                     setTimeout(() => setTotemActive(false), 1500); 
                     setTimeout(() => setIsInvincible(false), 3000);
                  } else if (totemActive) {
                     currentHealth = 100;
                  }
              }

              setHealth(Math.max(0, currentHealth));
              return newObstacles;
            });

            const spawnChance = 0.02 + (timeElapsed * 0.003);
            if (Math.random() < spawnChance) {
              setObstacles(prev => [...prev, { id: Date.now(), x: randomRange(10, 90), y: -10, type: 'ghost' }]);
            }

            reqRef.current = requestAnimationFrame(update);
          }, [playerX, playerY, failed, gameWon, timeLeft, health, isInvincible, totemActive]);

          useEffect(() => {
            reqRef.current = requestAnimationFrame(update);
            return () => cancelAnimationFrame(reqRef.current);
          }, [update]);

          const handleMove = (e) => {
            if (!containerRef.current || failed || gameWon) return;
            const rect = containerRef.current.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            setPlayerX(Math.max(5, Math.min(95, ((clientX - rect.left) / rect.width) * 100)));
            setPlayerY(Math.max(5, Math.min(95, ((clientY - rect.top) / rect.height) * 100)));
          };

          return (
            <div ref={containerRef} className="relative h-full w-full bg-slate-950 overflow-hidden touch-none cursor-none" onMouseMove={handleMove} onTouchMove={handleMove}>
              <motion.div 
                className="absolute inset-0 w-full h-full" 
                animate={totemActive ? { x: [-20, 20, -10, 10, -5, 5, 0] } : {}} 
                transition={{ duration: 0.5 }}
              >
                  <div className="absolute top-4 left-4 right-4 z-20 flex justify-between items-start font-mono font-bold pointer-events-none">
                    <div className="flex gap-4">
                       <div className="bg-black/50 px-3 py-1 border-l-4 border-blue-500 text-blue-300">SURVIVE: {timeLeft}s</div>
                       <div className="bg-yellow-900/80 px-3 py-1 rounded-full border border-yellow-500 text-white flex items-center gap-2">
                           <span className="text-xl">🗿</span><span className="font-bold">∞</span>
                       </div>
                    </div>
                    <div className="flex flex-col items-end w-32">
                      <div className="w-full h-4 bg-zinc-800 border border-white/20 rounded-full overflow-hidden relative">
                         <motion.div className={`h-full ${isInvincible ? 'bg-yellow-400' : (health > 50 ? 'bg-emerald-500' : (health > 25 ? 'bg-amber-500' : 'bg-rose-500'))}`} initial={{ width: "100%" }} animate={{ width: `${health}%` }} />
                         {isInvincible && <div className="absolute inset-0 flex items-center justify-center text-[10px] text-black font-bold uppercase tracking-widest animate-pulse">INVENCIBLE</div>}
                      </div>
                      <span className="text-xs text-white/50 mt-1">HP: {Math.ceil(health)}%</span>
                    </div>
                  </div>
                  <div className="absolute inset-0 w-full h-full opacity-30" style={{ backgroundImage: 'linear-gradient(0deg, transparent 24%, #3b82f6 25%, #3b82f6 26%, transparent 27%, transparent 74%, #3b82f6 75%, #3b82f6 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, #3b82f6 25%, #3b82f6 26%, transparent 27%, transparent 74%, #3b82f6 75%, #3b82f6 76%, transparent 77%, transparent)', backgroundSize: '50px 50px', transform: 'perspective(500px) rotateX(60deg) translateY(100px) scale(2)' }}></div>
                  
                  <motion.div className="absolute w-16 h-16 bg-blue-400 border-[3px] border-white shadow-[0_0_25px_#3b82f6] rounded-2xl" style={{ left: `calc(${playerX}% - 32px)`, top: `calc(${playerY}% - 32px)` }} animate={isInvincible ? { opacity: [1, 0.2, 1], scale: [1, 1.2, 1] } : (health < 30 ? { opacity: [1, 0.5, 1] } : {})} transition={isInvincible ? { repeat: Infinity, duration: 0.2 } : {}}>
                    <img src={PHOTOS.avatar} className="w-full h-full object-cover grayscale contrast-125 rounded-[13px]" style={{ imageRendering: 'pixelated' }} />
                    {isInvincible && <div className="absolute -top-6 left-1/2 -translate-x-1/2 text-yellow-400 animate-bounce"><Shield size={20} fill="currentColor" /></div>}
                  </motion.div>
                  {obstacles.map(ob => (
                    <div key={ob.id} className={`absolute flex items-center justify-center ${ob.type === 'fragment' ? 'w-4 h-4 text-orange-400' : 'text-4xl text-rose-500'}`} style={{ top: `${ob.y}%`, left: `${ob.x}%`, transform: 'translateX(-50%)' }}>
                      {ob.type === 'fragment' ? <Sparkles size={16} /> : <Ghost />}
                    </div>
                  ))}
              </motion.div>
              {totemActive && <TotemOverlay />}
              {failed && <RetryScreen onRetry={resetGame} message="¡Tú puedes, Lía!" />}
            </div>
          );
        };

        // JUEGO 2: PLANT CARE
        const PlantGame = ({ onWin, onKill }) => {
          const [plantState, setPlantState] = useState('idle'); 
          const [room, setRoom] = useState('living'); 
          const [dialog, setDialog] = useState("");
          const [animation, setAnimation] = useState('idle'); 
          const [endResult, setEndResult] = useState(null); 

          const triggerAnimation = (anim) => {
            setAnimation(anim);
            setTimeout(() => setAnimation('idle'), 2000);
          };

          const showImportantDialog = (text) => {
            setDialog(text);
          };

          const petResponses = [
            "¡¡Ay!! Con cuidadoooo!", 
            "Awwwww, grasias 🥰", 
            "Tenemos que hacer un golpe de estado en Venezuela 🥺", 
            "Isaac me acaricia más suave... just saying."
          ];
          
          const washResponses = [
            "¡¡¡¡¡¡¡Está fría!!!! 🥶", 
            "Glub glub glub 💧", 
            "¡Ay, me entró jabón a la hoja!", 
            "¡ESTÁ FRÍAAAA, LÍAAA!"
          ];

          useEffect(() => {
            if (plantState === 'dead' || endResult) return;
            const interval = setInterval(() => {
              if (animation !== 'idle') return; 
              const dialogs = {
                living: [
                  "Zzzzz... 😪", 
                  "Hazme caso... 🥺", 
                  "Me quieres? 🥀", 
                  "¿Sabías que Isaac te ama?... Ups, solté la sopa.", 
                  "Oye, Isaac me dijo que eres la mejor.", 
                  "Me aburro... cuéntame un chisme."
                ],
                kitchen: [
                  "TENGO HAMBRE", 
                  "Dame ese bistec ummmmmmm... 🥩", 
                  "Aliméntame o mueroooo... 💀",
                  "¿Sabías que Isaac no quiería entrar a la universidad?",
                  "Ese bistec se ve sospechoso, como que raro..."
                ],
                bathroom: [
                  "No me mires... 🙈", 
                  "Estoy sucia... 🛁", 
                  "Waters 💧",
                  "Canta conmigo en la ducha, porque tú cantas 🎤",
                  "¡Trae el shampooooo!"
                ]
              };
              setDialog(dialogs[room][Math.floor(Math.random() * dialogs[room].length)]);
            }, 4000);
            return () => clearInterval(interval);
          }, [room, plantState, animation, endResult]);
          
          const handleKill = () => {
            setPlantState('dead');
            setDialog("...");
            setEndResult('failure');
          };

          const handleInteract = (action) => {
            if (action === 'pet') {
              const res = petResponses[Math.floor(Math.random() * petResponses.length)];
              showImportantDialog(res);
              triggerAnimation('petting');
            }
            if (action === 'wash') {
              const res = washResponses[Math.floor(Math.random() * washResponses.length)];
              showImportantDialog(res);
              triggerAnimation('washing');
            }
            if (action === 'poison') {
              triggerAnimation('eating');
              setEndResult('success');
            }
          };

          const plantVariants = {
            idle: { scaleY: [0.95, 1.02, 0.95], scaleX: [1.02, 0.98, 1.02], rotate: 0 },
            petting: { rotate: [0, 5, -5, 5, -5, 0], scale: 1.1 },
            washing: { y: [0, 5, -5, 0], filter: "brightness(1.2)" },
            eating: { scaleX: [1, 1.3, 0.8, 1], scaleY: [1, 0.8, 1.2, 1] }
          };

          if (endResult) {
            return (
              <motion.div 
                className={`h-full w-full flex flex-col items-center justify-center text-center p-8 select-none relative overflow-hidden ${endResult === 'success' ? 'bg-emerald-950' : 'bg-rose-950'}`}
                animate={endResult === 'failure' ? { x: [-30, 30, -30, 30, -15, 15, 0], backgroundColor: ['#4c0519', '#881337', '#4c0519'] } : {}}
                transition={{ duration: 0.8, repeat: endResult === 'failure' ? Infinity : 0 }}
              >
                {endResult === 'failure' && (
                  <div className="absolute inset-0 bg-red-600 mix-blend-multiply opacity-50 animate-pulse pointer-events-none" />
                )}
                {endResult === 'success' && (
                  <div className="absolute inset-0 bg-blue-500 mix-blend-overlay opacity-30 pointer-events-none" />
                )}

                {endResult === 'success' && [...Array(20)].map((_, i) => (
                  <motion.div
                    key={`heart-${i}`}
                    className="absolute text-3xl text-emerald-400 drop-shadow-[0_0_10px_rgba(16,185,129,0.8)]"
                    initial={{ x: 0, y: 0, scale: 0, opacity: 1 }}
                    animate={{ 
                      x: (Math.random() - 0.5) * 500, y: (Math.random() - 0.5) * 500, 
                      scale: Math.random() * 2 + 1, opacity: 0 
                    }}
                    transition={{ duration: 1.5 + Math.random(), repeat: Infinity }}
                  >
                    ✨
                  </motion.div>
                ))}

                <motion.div 
                  initial={{ scale: 0 }} 
                  animate={endResult === 'success' ? { scale: [0, 3, 1], rotate: [0, 360, 360] } : { scale: [0, 4, 1.5], rotate: [-20, 20, -20, 20, 0] }}
                  transition={{ duration: 1.2, type: "spring" }}
                  className="mb-8 landscape:mb-4 text-9xl landscape:text-7xl z-10 relative"
                >
                  {endResult === 'success' ? '🌱' : '💀'}
                </motion.div>

                <motion.h1 
                  initial={{ opacity: 0, y: 50 }} 
                  animate={{ opacity: 1, y: 0 }}
                  transition={{ delay: 0.5 }}
                  className={`text-3xl md:text-5xl landscape:text-2xl font-black text-white mb-12 landscape:mb-6 z-10 relative drop-shadow-2xl uppercase tracking-tighter leading-tight`}
                >
                  {endResult === 'success' ? "¡ERES BUENA CUIDANDO, LÍA! :D el veneno no afecta a la planta!!" : "¡LA MATASTE!\n¡QUÉ MALA ERES! El bistec tenía un virus mortal para la planta🥀"}
                </motion.h1>

                <motion.button
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  transition={{ delay: 1.5 }}
                  whileHover={{ scale: 1.1 }}
                  whileTap={{ scale: 0.9 }}
                  onClick={endResult === 'success' ? onWin : onKill}
                  className="bg-white text-black font-black py-4 px-10 landscape:py-2 landscape:px-6 rounded-2xl text-xl landscape:text-lg shadow-[0_0_30px_rgba(255,255,255,0.4)] flex items-center gap-2 z-10 relative border-4 border-transparent"
                >
                  Siguiente Juego <ArrowRight />
                </motion.button>
              </motion.div>
            );
          }

          return (
            <div className="h-full w-full bg-slate-950 flex flex-col items-center justify-between p-4 relative overflow-hidden select-none">
              <motion.div animate={{ backgroundColor: room === 'kitchen' ? '#881337' : (room === 'bathroom' ? '#172554' : '#14532d') }} className="absolute inset-0 z-0 transition-colors duration-500" />
              <div className="relative z-20 w-full bg-yellow-400 text-black font-black uppercase text-xs p-2 tracking-widest animate-pulse text-center rounded-2xl shadow-lg shrink-0">MISIÓN: Cuida la fucking planta</div>

              <div className="flex-1 w-full flex flex-col landscape:flex-row items-center justify-center relative z-10 landscape:gap-8">
                
                <div className="flex flex-col items-center justify-center w-full landscape:w-1/2">
                  <motion.div key={dialog} initial={{ opacity: 0, y: 10, scale: 0.9 }} animate={{ opacity: 1, y: 0, scale: 1 }} className="bg-white text-black p-4 landscape:p-2 rounded-2xl rounded-bl-none mb-4 landscape:mb-2 relative font-bold shadow-xl max-w-[80%] text-sm md:text-base">
                    "{dialog}" <div className="absolute -bottom-2 left-4 w-4 h-4 bg-white rotate-45" />
                  </motion.div>

                  <div className="relative">
                     {animation === 'petting' && (
                       <motion.div className="absolute -top-10 left-0 right-0 flex justify-center gap-4 text-rose-500 z-30">
                         {[1,2,3].map(i => <motion.div key={i} initial={{y:0, opacity:1}} animate={{y:-50, opacity:0}} transition={{duration:1, delay: i*0.2}}><Heart fill="currentColor" /></motion.div>)}
                       </motion.div>
                     )}
                     {animation === 'washing' && (
                       <motion.div className="absolute -top-20 left-0 right-0 flex justify-center gap-2 text-blue-400 z-30">
                         {[1,2,3,4,5].map(i => <motion.div key={i} initial={{y:-20, opacity:0}} animate={{y:100, opacity: [1, 0]}} transition={{duration:0.8, repeat: Infinity, delay: i*0.1}}><Droplets size={16} fill="currentColor" /></motion.div>)}
                       </motion.div>
                     )}

                     <motion.div
                      animate={plantState === 'dead' ? { rotate: 180, scale: 0.5, opacity: 0.5, y: 100 } : (plantVariants[animation] || plantVariants.idle)}
                      transition={{ duration: animation === 'idle' ? 2 : 0.5, repeat: animation === 'idle' ? Infinity : (animation === 'petting' ? 2 : 0), ease: "easeInOut" }}
                      className="relative w-64 h-64 landscape:w-32 landscape:h-32 flex items-center justify-center drop-shadow-2xl"
                    >
                        <img src={PHOTOS.plant} alt="Planta" className={`w-full h-full object-contain filter ${plantState === 'dead' ? 'grayscale brightness-50' : 'contrast-125'}`} />
                        {plantState !== 'dead' && (
                          <>
                             <motion.div animate={{ scaleY: [1, 0.1, 1] }} transition={{ repeat: Infinity, duration: 4, delay: 1 }} className="absolute top-1/3 left-1/3 w-8 h-8 landscape:w-5 landscape:h-5 bg-white rounded-full border-2 border-black flex items-center justify-center"><div className="w-3 h-3 landscape:w-2 landscape:h-2 bg-black rounded-full translate-x-1" /></motion.div>
                             <motion.div animate={{ scaleY: [1, 0.1, 1] }} transition={{ repeat: Infinity, duration: 4, delay: 1.1 }} className="absolute top-1/3 right-1/3 w-8 h-8 landscape:w-5 landscape:h-5 bg-white rounded-full border-2 border-black flex items-center justify-center"><div className="w-3 h-3 landscape:w-2 landscape:h-2 bg-black rounded-full translate-x-1" /></motion.div>
                          </>
                        )}
                    </motion.div>
                  </div>
                </div>

                <div className="h-24 landscape:h-auto w-full landscape:w-1/2 flex items-center justify-center mt-4 landscape:mt-0">
                    <AnimatePresence mode="wait">
                        {room === 'kitchen' && (
                          <motion.div key="kitchen-actions" initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} exit={{ opacity: 0, y: -20 }} className="flex landscape:flex-col gap-4">
                            <button onClick={handleKill} className="bg-rose-600 hover:bg-rose-500 text-white p-3 landscape:p-2 rounded-2xl font-bold flex flex-col items-center gap-1 border-b-4 border-rose-800 active:border-b-0 active:translate-y-1 transition-all shadow-lg"><Utensils size={24} /><span className="text-xs">Bistec Tieso</span></button>
                            <button onClick={() => handleInteract('poison')} className="bg-blue-600 hover:bg-blue-500 text-white p-3 landscape:p-2 rounded-2xl font-bold flex flex-col items-center gap-1 border-b-4 border-blue-800 active:border-b-0 active:translate-y-1 transition-all shadow-lg"><FlaskConical size={24} /><span className="text-xs">Veneno (?)</span></button>
                          </motion.div>
                        )}
                        {room === 'living' && <motion.button key="act-pet" onClick={() => handleInteract('pet')} initial={{opacity:0}} animate={{opacity:1}} className="bg-yellow-500 text-black p-3 landscape:p-2 rounded-2xl w-32 font-bold flex flex-col items-center border-b-4 border-yellow-700 active:border-b-0 active:translate-y-1"><Hand className="mx-auto mb-1"/><span className="text-xs">Acariciar</span></motion.button>}
                        {room === 'bathroom' && <motion.button key="act-wash" onClick={() => handleInteract('wash')} initial={{opacity:0}} animate={{opacity:1}} className="bg-blue-500 text-white p-3 landscape:p-2 rounded-2xl w-32 font-bold flex flex-col items-center border-b-4 border-blue-700 active:border-b-0 active:translate-y-1"><Droplets className="mx-auto mb-1"/><span className="text-xs">Bañar</span></motion.button>}
                    </AnimatePresence>
                </div>
              </div>

              <div className="relative z-20 bg-black/50 backdrop-blur-md p-2 rounded-3xl flex gap-2 w-full justify-between max-w-xs landscape:max-w-md shrink-0 border border-white/10">
                <button onClick={() => setRoom('living')} className={`flex-1 p-2 rounded-2xl flex flex-col items-center transition-colors ${room === 'living' ? 'bg-yellow-400 text-black shadow-lg' : 'text-zinc-400 hover:text-white'}`}><Sofa size={20}/><span className="text-[10px] font-bold mt-1">SALA</span></button>
                <button onClick={() => setRoom('kitchen')} className={`flex-1 p-2 rounded-2xl flex flex-col items-center transition-colors ${room === 'kitchen' ? 'bg-rose-500 text-white shadow-lg' : 'text-zinc-400 hover:text-white'}`}><Utensils size={20}/><span className="text-[10px] font-bold mt-1">COCINA</span></button>
                <button onClick={() => setRoom('bathroom')} className={`flex-1 p-2 rounded-2xl flex flex-col items-center transition-colors ${room === 'bathroom' ? 'bg-blue-500 text-white shadow-lg' : 'text-zinc-400 hover:text-white'}`}><Bath size={20}/><span className="text-[10px] font-bold mt-1">BAÑO</span></button>
              </div>
            </div>
          );
        };

        // JUEGO 3.5: SHRIMP ACTION HERO
        const ShrimpGame = ({ onWin }) => {
          const [player, setPlayer] = useState({ x: 10, y: 0, vy: 0, facingRight: true });
          const [bullets, setBullets] = useState([]);
          const [shrimps, setShrimps] = useState([]);
          const [ammoPickups, setAmmoPickups] = useState([]);
          const [totems, setTotems] = useState([]); 
          const [hasTotem, setHasTotem] = useState(false); 
          const [resurrecting, setResurrecting] = useState(false); 
          const [isDying, setIsDying] = useState(false); 
          const [health, setHealth] = useState(100);
          const [round, setRound] = useState(1);
          const [killsInRound, setKillsInRound] = useState(0);
          
          const [clip, setClip] = useState(12); 
          const [reserve, setReserve] = useState(24); 
          const [isReloading, setIsReloading] = useState(false);

          const [gameOver, setGameOver] = useState(false);
          const [input, setInput] = useState({ left: false, right: false, jump: false, shoot: false, reload: false });
          const [roundTransition, setRoundTransition] = useState(false);
          
          const loopRef = useRef();
          
          const PLATFORMS = [
            { x: 20, y: 25, w: 20, h: 2 },
            { x: 60, y: 45, w: 25, h: 2 },
            { x: 10, y: 55, w: 15, h: 2 }
          ];

          const ROUNDS = [
            { target: 10, spawnRate: 0.02, speed: 0.25, hp: 3, ammoRate: 0.003 }, 
            { target: 20, spawnRate: 0.035, speed: 0.35, hp: 4, ammoRate: 0.005 }, 
            { target: 35, spawnRate: 0.045, speed: 0.45, hp: 5, ammoRate: 0.010 } 
          ];

          const CLIP_SIZE = 12;
          const RELOAD_TIME = 1500; 

          const clipRef = useRef(clip);
          const reserveRef = useRef(reserve);
          
          useEffect(() => { clipRef.current = clip; }, [clip]);
          useEffect(() => { reserveRef.current = reserve; }, [reserve]);

          const handleReloadLogic = useCallback(() => {
              if (isReloading || clipRef.current >= CLIP_SIZE || reserveRef.current <= 0) return;
              setIsReloading(true);
              setTimeout(() => {
                  const currentClip = clipRef.current;
                  const currentReserve = reserveRef.current;
                  const needed = CLIP_SIZE - currentClip;
                  const taking = Math.min(needed, currentReserve);
                  
                  setClip(c => c + taking);
                  setReserve(r => r - taking);
                  setIsReloading(false);
              }, RELOAD_TIME);
          }, [isReloading, CLIP_SIZE]);

          useEffect(() => {
            const handleKeyDown = (e) => {
              if (gameOver || isDying) return;
              switch(e.key.toLowerCase()) {
                case 'a': setInput(prev => ({...prev, left: true})); break;
                case 'd': setInput(prev => ({...prev, right: true})); break;
                case 'w': case 'arrowup': setInput(prev => ({...prev, jump: true})); break;
                case ' ': setInput(prev => ({...prev, shoot: true})); break;
                case 'r': handleReloadLogic(); break;
              }
            };
            const handleKeyUp = (e) => {
              switch(e.key.toLowerCase()) {
                case 'a': setInput(prev => ({...prev, left: false})); break;
                case 'd': setInput(prev => ({...prev, right: false})); break;
                case 'w': case 'arrowup': setInput(prev => ({...prev, jump: false})); break;
                case ' ': setInput(prev => ({...prev, shoot: false})); break;
              }
            };
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            return () => {
              window.removeEventListener('keydown', handleKeyDown);
              window.removeEventListener('keyup', handleKeyUp);
            };
          }, [gameOver, isDying, clip, reserve, handleReloadLogic]);

          const handleTouchStart = (action) => setInput(prev => ({ ...prev, [action]: true }));
          const handleTouchEnd = (action) => setInput(prev => ({ ...prev, [action]: false }));

          useEffect(() => {
            if (input.jump && !gameOver && !isDying) {
                const onGround = player.y <= 0.1;
                const onPlat = PLATFORMS.some(p => Math.abs(player.y - p.y) < 1 && player.x > p.x - 2 && player.x < p.x + p.w + 2);
                if (onGround || onPlat) {
                     setPlayer(p => ({ ...p, vy: 4.5 })); 
                }
            }
          }, [input.jump, gameOver, isDying]); 

          useEffect(() => {
            if (input.shoot && !gameOver && !isDying) {
                if (clip > 0 && !isReloading) {
                    setBullets(prev => [...prev, { 
                        id: Date.now() + Math.random(), 
                        x: player.x + (player.facingRight ? 5 : -5), 
                        y: player.y + 5, 
                        dir: player.facingRight ? 1 : -1 
                    }]);
                    setClip(c => c - 1);
                }
            }
          }, [input.shoot, gameOver, isDying]); 

          useEffect(() => {
            if (gameOver || roundTransition || resurrecting || isDying) return;

            const currentRoundConfig = ROUNDS[round - 1];

            const loop = () => {
              setPlayer(p => {
                let newX = p.x;
                if (input.left) newX -= 0.8;
                if (input.right) newX += 0.8;
                newX = Math.max(0, Math.min(95, newX)); 

                let newY = p.y + p.vy;
                let newVy = p.vy - 0.25; 

                let grounded = false;
                if (newY <= 0) { 
                    newY = 0; 
                    newVy = 0; 
                    grounded = true; 
                } else if (p.vy <= 0) { 
                    PLATFORMS.forEach(plat => {
                        if (p.y >= plat.y && newY <= plat.y && newX + 5 > plat.x && newX < plat.x + plat.w) {
                            newY = plat.y;
                            newVy = 0;
                            grounded = true;
                        }
                    });
                }

                return { ...p, x: newX, y: newY, vy: newVy, facingRight: input.right ? true : (input.left ? false : p.facingRight) };
              });

              setBullets(prev => prev.map(b => ({ ...b, x: b.x + (b.dir * 2.5) })).filter(b => b.x > -10 && b.x < 110));

              if (Math.random() < currentRoundConfig.spawnRate) {
                 setShrimps(prev => [...prev, { id: Math.random(), x: Math.random() > 0.5 ? 100 : -10, y: 0, hp: currentRoundConfig.hp }]);
              }

              if (Math.random() < currentRoundConfig.ammoRate) { 
                  setAmmoPickups(prev => [...prev, { id: Math.random(), x: randomRange(10, 90), y: 50 }]);
              }

              if (!hasTotem && Math.random() < 0.005) { 
                  setTotems(prev => [...prev, { id: Math.random(), x: randomRange(10, 90), y: 50 }]);
              }

              setAmmoPickups(prev => {
                  let nextPickups = prev.map(a => ({...a, y: Math.max(0, a.y - 0.5)}));
                  let collected = [];
                  let remaining = [];
                  nextPickups.forEach(a => {
                      if (Math.abs(a.x - player.x) < 8 && Math.abs(a.y - player.y) < 8) collected.push(a);
                      else remaining.push(a);
                  });
                  if (collected.length > 0) setReserve(r => r + (collected.length * 12)); 
                  return remaining;
              });

              setTotems(prev => {
                  let nextTotems = prev.map(t => ({...t, y: Math.max(0, t.y - 0.5)}));
                  let collected = false;
                  let remaining = [];
                  nextTotems.forEach(t => {
                      if (Math.abs(t.x - player.x) < 8 && Math.abs(t.y - player.y) < 8) collected = true;
                      else remaining.push(t);
                  });
                  if (collected) setHasTotem(true);
                  return remaining;
              });

              setShrimps(prev => {
                 let nextShrimps = prev.map(z => {
                     const dir = z.x > player.x ? -currentRoundConfig.speed : currentRoundConfig.speed;
                     return { ...z, x: z.x + dir };
                 });

                 nextShrimps = nextShrimps.map(z => {
                     const hit = bullets.some(b => Math.abs(b.x - z.x) < 5 && Math.abs(b.y - z.y) < 10); 
                     if (hit) return { ...z, hp: z.hp - 1, hit: true };
                     return { ...z, hit: false };
                 });
                 
                 let livingShrimps = [];
                 let deadCount = 0;
                 nextShrimps.forEach(z => {
                     if (z.hp > 0) livingShrimps.push(z);
                     else deadCount++;
                 });

                 if (deadCount > 0) setKillsInRound(k => k + deadCount);

                 livingShrimps.forEach(z => {
                     if (Math.abs(z.x - player.x) < 5 && Math.abs(z.y - player.y) < 8) {
                         setHealth(h => Math.max(0, h - 1));
                     }
                 });

                 return livingShrimps;
              });

              if (health <= 0) {
                  if (hasTotem) {
                      setResurrecting(true);
                      setHasTotem(false);
                      setTimeout(() => {
                          setHealth(100);
                          setResurrecting(false);
                          setShrimps(prev => prev.filter(z => Math.abs(z.x - player.x) > 30));
                      }, 2500); 
                  } else {
                      setIsDying(true);
                      setTimeout(() => {
                          setIsDying(false);
                          setGameOver(true);
                      }, 1000);
                  }
              }
            };

            loopRef.current = setInterval(loop, 16); 
            return () => clearInterval(loopRef.current);
          }, [input, player, bullets, health, gameOver, roundTransition, round, clip, isReloading, hasTotem, resurrecting, isDying]);

          useEffect(() => {
            if (gameOver) return;
            const currentTarget = ROUNDS[round - 1].target;
            
            if (killsInRound >= currentTarget) {
              if (round < ROUNDS.length) {
                setRoundTransition(true);
                setTimeout(() => {
                  setRound(r => r + 1);
                  setKillsInRound(0);
                  setShrimps([]);
                  setBullets([]);
                  setRoundTransition(false);
                }, 3000);
              } else {
                setTimeout(onWin, 500);
                setGameOver(true);
              }
            }
          }, [killsInRound, round, gameOver, onWin]);

          return (
            <div className="h-full w-full bg-gray-900 relative overflow-hidden select-none font-mono">
               <div className="absolute inset-0 opacity-40 bg-cover bg-center" style={{ backgroundImage: `url(${PHOTOS.apocalypse_bg})` }} />
               
               <motion.div 
                 className="absolute inset-0 w-full h-full"
                 animate={resurrecting ? { x: [-10, 10, -10, 10, 0], y: [-5, 5, -5, 5, 0] } : (isDying ? { x: [-20, 20, -15, 15, -10, 10, 0], opacity: [1, 0.5, 0] } : {})}
                 transition={{ duration: 0.5, repeat: resurrecting ? Infinity : 0 }}
               >
                   {isDying && <div className="absolute inset-0 bg-red-600 mix-blend-multiply z-50 animate-pulse"></div>}

                   <div className="absolute top-4 left-4 z-30 flex flex-col gap-2">
                      <div className="flex gap-4">
                        <div className="bg-rose-900/80 px-4 py-1 rounded-full border border-rose-500 text-white font-bold flex items-center gap-2">
                            <Heart size={16} className="fill-rose-500" /> {Math.floor(health)}%
                        </div>
                        <div className={`px-4 py-1 rounded-full border text-white font-bold flex items-center gap-2 transition-all ${isReloading ? 'bg-orange-600 border-orange-400 animate-pulse' : (clip === 0 ? 'bg-blue-600 border-blue-400' : 'bg-yellow-600/80 border-yellow-500')}`}>
                            <Zap size={16} className="fill-yellow-500" /> 
                            {isReloading ? "RECARGANDO..." : `${clip} / ${reserve}`}
                        </div>
                        {hasTotem && (
                            <div className="bg-purple-900/80 px-3 py-1 rounded-full border border-purple-500 text-white flex items-center gap-1 animate-pulse">
                                <span className="text-xl">🗿</span>
                            </div>
                        )}
                      </div>
                      <div className="bg-zinc-800/80 px-4 py-1 rounded-full border border-zinc-500 text-white font-bold text-sm">
                         RONDA {round}/{ROUNDS.length} | CAMARONES: {killsInRound}/{ROUNDS[round-1].target}
                      </div>
                   </div>

                   {PLATFORMS.map((p, i) => (
                       <div key={i} className="absolute bg-zinc-700 border-t-[4px] border-zinc-500 rounded-sm shadow-lg z-10" style={{ left: `${p.x}%`, bottom: `${p.y}%`, width: `${p.w}%`, height: `${p.h}%` }} />
                   ))}

                   <div className="absolute bottom-0 w-full h-32 bg-gradient-to-t from-black to-transparent z-0" />
                   <div className="absolute bottom-0 w-full h-8 bg-zinc-900 border-t-[4px] border-zinc-700 z-10" />

                   {ammoPickups.map(a => (
                       <div key={a.id} className="absolute z-15 animate-bounce" style={{ left: `${a.x}%`, bottom: `${8 + a.y}%` }}>
                           <Package size={24} className="text-yellow-400 drop-shadow-[0_0_10px_rgba(250,204,21,0.8)]" />
                       </div>
                   ))}
                   {totems.map(t => (
                       <div key={t.id} className="absolute z-15 animate-bounce" style={{ left: `${t.x}%`, bottom: `${8 + t.y}%` }}>
                           <div className="text-3xl filter drop-shadow-[0_0_15px_purple]">🗿</div>
                       </div>
                   ))}

                   <div className="absolute w-12 h-16 z-20 transition-transform" style={{ left: `${player.x}%`, bottom: `${8 + player.y}%`, transform: `scaleX(${player.facingRight ? 1 : -1})` }}>
                      <img src={PHOTOS.avatar} className="w-full h-full object-cover rounded-xl border-2 border-white shadow-lg" style={{ imageRendering: 'pixelated' }} />
                      <img src={PHOTOS.gun} className="absolute top-6 -right-4 w-8 h-6 object-contain" style={{ imageRendering: 'pixelated' }} />
                      {isReloading && (
                         <div className="absolute -top-4 left-0 w-full h-1 bg-zinc-700 rounded-full">
                           <motion.div initial={{width:0}} animate={{width:"100%"}} transition={{duration: 1.5}} className="h-full bg-yellow-400" />
                         </div>
                      )}
                   </div>

                   {/* CAMARONES RENDER */}
                   {shrimps.map(z => (
                      <div key={z.id} className="absolute w-16 h-16 z-15 grayscale-[20%] drop-shadow-xl" style={{ left: `${z.x}%`, bottom: `${8 + z.y}%` }}>
                         <img src={PHOTOS.shrimp} className="w-full h-full object-contain filter drop-shadow-lg" style={{ imageRendering: 'pixelated' }} />
                         <div className="absolute -top-2 w-full h-1 bg-rose-900"><div className="h-full bg-emerald-500" style={{ width: `${(z.hp/ROUNDS[round-1].hp)*100}%` }} /></div>
                      </div>
                   ))}

                   {bullets.map(b => (
                      <div key={b.id} className="absolute w-2 h-2 bg-yellow-400 rounded-full z-15 shadow-[0_0_8px_yellow]" style={{ left: `${b.x}%`, bottom: `${8 + b.y}%` }} />
                   ))}
               </motion.div>

               {resurrecting && <ResurrectionOverlay />}
               {isDying && !gameOver && <DeathOverlay />}
               
               {roundTransition && (
                 <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/90 flex-col">
                   <h2 className="text-4xl text-yellow-400 font-black animate-bounce mb-2">¡RONDA COMPLETADA!</h2>
                   <p className="text-zinc-300 text-xl font-bold">Prepárate para la Ronda {round + 1}...</p>
                 </div>
               )}

               <div className="absolute bottom-4 left-4 z-40 flex gap-2">
                  <button onMouseDown={() => handleTouchStart('left')} onMouseUp={() => handleTouchEnd('left')} onTouchStart={(e) => { e.preventDefault(); handleTouchStart('left'); }} onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('left'); }} className="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl border-2 border-white/20 flex items-center justify-center active:bg-white/30"><ArrowLeft size={32} className="text-white" /></button>
                  <button onMouseDown={() => handleTouchStart('right')} onMouseUp={() => handleTouchEnd('right')} onTouchStart={(e) => { e.preventDefault(); handleTouchStart('right'); }} onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('right'); }} className="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl border-2 border-white/20 flex items-center justify-center active:bg-white/30"><ArrowRight size={32} className="text-white" /></button>
               </div>

               <div className="absolute bottom-4 right-4 z-40 flex gap-4">
                  <button onClick={handleReloadLogic} className={`w-16 h-16 backdrop-blur-md rounded-2xl border-[3px] flex items-center justify-center active:scale-95 shadow-lg transition-colors ${isReloading ? 'bg-zinc-600 border-zinc-500' : 'bg-blue-600/80 border-blue-400'}`}>
                     <RotateCw size={32} className={`text-white ${isReloading ? 'animate-spin' : ''}`} />
                  </button>
                  <button onMouseDown={() => handleTouchStart('shoot')} onMouseUp={() => handleTouchEnd('shoot')} onTouchStart={(e) => { e.preventDefault(); handleTouchStart('shoot'); }} onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('shoot'); }} className={`w-16 h-16 backdrop-blur-md rounded-2xl border-[3px] flex items-center justify-center active:scale-95 shadow-lg ${clip > 0 ? 'bg-rose-500/80 border-rose-400' : 'bg-zinc-600/80 border-zinc-500 cursor-not-allowed'}`}><Crosshair size={32} className="text-white" /></button>
                  <button onMouseDown={() => handleTouchStart('jump')} onMouseUp={() => handleTouchEnd('jump')} onTouchStart={(e) => { e.preventDefault(); handleTouchStart('jump'); }} onTouchEnd={(e) => { e.preventDefault(); handleTouchEnd('jump'); }} className="w-16 h-16 bg-emerald-500/80 backdrop-blur-md rounded-2xl border-[3px] border-emerald-400 flex items-center justify-center active:scale-95 shadow-lg"><ArrowUp size={32} className="text-white" /></button>
               </div>
               
               <div className="hidden md:block absolute bottom-4 left-1/2 -translate-x-1/2 text-white/50 text-xs font-mono bg-black/50 px-2 py-1 rounded pointer-events-none">
                  
               </div>

               {gameOver && health <= 0 && <RetryScreen onRetry={() => { setHealth(100); setShrimps([]); setBullets([]); setGameOver(false); setKillsInRound(0); setRound(1); setClip(12); setReserve(24); setHasTotem(false); setTotems([]); setIsDying(false); }} message="¡Te devoraron los camarones!" />}
            </div>
          );
        };

        // JUEGO 4: EXPEDITION ANTARCTICA (MEJORADO Y MÁS LARGO)
        const AntarcticaGame = ({ onWin }) => {
          const [player, setPlayer] = useState({ x: 50, y: 50, vy: 0 });
          const [platforms, setPlatforms] = useState([
            { id: 1, x: 0, y: 10, w: 100, h: 4 },
            { id: 2, x: 30, y: 35, w: 25, h: 4 },
            { id: 3, x: 60, y: 60, w: 25, h: 4 },
            { id: 4, x: 20, y: 85, w: 25, h: 4 },
          ]);
          const [icicles, setIcicles] = useState([]);
          const [score, setScore] = useState(0);
          const [gameOver, setGameOver] = useState(false);
          const [input, setInput] = useState({ left: false, right: false });
          const [gameWon, setGameWon] = useState(false);
          const [showWarning, setShowWarning] = useState(false);

          // Meta final ajustada para que tome un buen rato
          const TARGET_SCORE = 10000;

          useEffect(() => {
            const handleKeyDown = (e) => {
              if (gameOver || gameWon) return;
              const key = e.key.toLowerCase();
              if (key === 'a' || e.key === 'ArrowLeft') setInput(prev => ({...prev, left: true}));
              if (key === 'd' || e.key === 'ArrowRight') setInput(prev => ({...prev, right: true}));
            };
            const handleKeyUp = (e) => {
              const key = e.key.toLowerCase();
              if (key === 'a' || e.key === 'ArrowLeft') setInput(prev => ({...prev, left: false}));
              if (key === 'd' || e.key === 'ArrowRight') setInput(prev => ({...prev, right: false}));
            };
            window.addEventListener('keydown', handleKeyDown);
            window.addEventListener('keyup', handleKeyUp);
            return () => {
              window.removeEventListener('keydown', handleKeyDown);
              window.removeEventListener('keyup', handleKeyUp);
            };
          }, [gameOver, gameWon]);

          const handleTouchStart = (action) => setInput(prev => ({ ...prev, [action]: true }));
          const handleTouchEnd = (action) => setInput(prev => ({ ...prev, [action]: false }));

          // Alerta de tormenta a 1/3 del camino
          useEffect(() => {
            if (score > TARGET_SCORE / 3 && score < (TARGET_SCORE / 3) + 200) {
               setShowWarning(true);
            } else {
               setShowWarning(false);
            }
          }, [score]);

          useEffect(() => {
            if (gameOver || gameWon) return;

            const loop = setInterval(() => {
               setPlayer(p => {
                  let newVy = p.vy - 0.25; // Gravedad MÁS LENTA (más controlable)
                  let newX = p.x;
                  
                  if (input.left) newX -= 1.2; // Movimiento horizontal más lento y preciso
                  if (input.right) newX += 1.2;

                  if (newX < -5) newX = 105;
                  if (newX > 105) newX = -5;

                  let newY = p.y + newVy;

                  if (newVy < 0) {
                      platforms.forEach(plat => {
                          if (p.y >= plat.y && newY <= plat.y + plat.h && newX + 5 > plat.x && newX - 5 < plat.x + plat.w) {
                              newY = plat.y + plat.h;
                              newVy = 6.5; // Salto balanceado con la nueva gravedad
                          }
                      });
                  }

                  let scroll = 0;
                  if (newY > 50) {
                      scroll = newY - 50;
                      newY = 50;
                      // El puntaje sube más lento ahora
                      setScore(s => s + Math.floor(scroll * 4));
                  }

                  if (scroll > 0) {
                      setPlatforms(plats => {
                          let nextPlats = plats.map(pl => ({ ...pl, y: pl.y - scroll })).filter(pl => pl.y > -10);
                          const topPlat = nextPlats[nextPlats.length - 1];
                          if (topPlat && topPlat.y < 80) {
                              // A medida que subes, las plataformas se achican un POQUITO, sin ser imposibles
                              const shrinkFactor = Math.max(15, 25 - (score / 2000));
                              nextPlats.push({
                                  id: Math.random(),
                                  x: Math.random() * (100 - shrinkFactor), 
                                  y: topPlat.y + 15 + Math.random() * 15,
                                  w: shrinkFactor, 
                                  h: 4
                              });
                          }
                          return nextPlats;
                      });
                  }

                  if (newY < -10) {
                      setGameOver(true);
                  }

                  return { x: newX, y: newY, vy: newVy };
               });

               // TORMENTA DE HIELO (Obstáculos horizontales a partir de 1/3)
               if (score > TARGET_SCORE / 3) {
                   const stormIntensity = score > (TARGET_SCORE / 1.5) ? 0.012 : 0.006;
                   if (Math.random() < stormIntensity) {
                       setIcicles(prev => [...prev, {
                           id: Math.random(),
                           x: Math.random() > 0.5 ? 110 : -10, // Salen de los lados
                           y: Math.random() * 80 + 10, // A diferentes alturas
                           speed: score > (TARGET_SCORE / 1.5) ? 0.9 : 0.6, // Velocidad justa
                           dir: Math.random() > 0.5 ? 1 : -1
                       }]);
                   }
               }

               setIcicles(prev => {
                   let alive = [];
                   prev.forEach(ice => {
                       ice.x += (ice.speed * ice.dir);
                       if (ice.x > -20 && ice.x < 120) alive.push(ice);

                       // Colisión con el jugador
                       setPlayer(p => {
                           if (Math.abs(ice.x - p.x) < 5 && Math.abs(ice.y - p.y) < 5) {
                               setGameOver(true);
                           }
                           return p;
                       });
                   });
                   return alive;
               });

            }, 16);
            return () => clearInterval(loop);
          }, [input, gameOver, platforms, gameWon, score]);

          useEffect(() => {
            if (score >= TARGET_SCORE && !gameWon) {
               setGameWon(true);
               setTimeout(onWin, 2500);
            }
          }, [score, gameWon, onWin]);

          const resetGame = () => {
             setPlayer({ x: 50, y: 50, vy: 0 });
             setPlatforms([
                { id: 1, x: 0, y: 10, w: 100, h: 4 },
                { id: 2, x: 40, y: 35, w: 25, h: 4 },
                { id: 3, x: 20, y: 60, w: 25, h: 4 },
                { id: 4, x: 60, y: 85, w: 25, h: 4 },
             ]);
             setScore(0);
             setGameOver(false);
          };

          // Línea de Meta (Corregido para que baje desde el cielo naturalmente)
          const goalBottom = 50 + (TARGET_SCORE - score) / 4;

          return (
            <div className="h-full w-full relative overflow-hidden select-none font-sans bg-sky-950">
               <div className="absolute inset-0 opacity-60 bg-cover bg-center" style={{ backgroundImage: `url(${PHOTOS.antarctica_bgr3})` }} />
               
               <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-30 animate-pulse pointer-events-none" />

               {/* Meta visible al final */}
               {score > (TARGET_SCORE - 600) && (
                   <div 
                     className="absolute w-full h-8 bg-yellow-400 border-b-[4px] border-yellow-600 shadow-[0_0_30px_yellow] z-0 flex items-center justify-center overflow-hidden"
                     style={{ bottom: `${goalBottom}%` }}
                   >
                       <span className="text-yellow-900 font-black tracking-[1em] text-xl opacity-50">META META META</span>
                   </div>
               )}

               <div className="absolute top-6 left-6 right-6 z-30 flex justify-between items-start">
                  <div className="flex flex-col gap-2 w-48">
                    <div className="bg-white/10 backdrop-blur-md px-4 py-2 rounded-2xl border-2 border-white/20 text-white font-bold text-lg shadow-lg">
                       ALTITUD: {score}m
                    </div>
                    <div className="w-full h-3 bg-black/50 rounded-full overflow-hidden border border-white/10 mt-1">
                       <div className="h-full bg-cyan-400" style={{ width: `${Math.min((score/TARGET_SCORE)*100, 100)}%` }} />
                    </div>
                  </div>
               </div>

               {/* Aviso de tormenta */}
               {showWarning && (
                 <div className="absolute top-24 left-0 w-full flex justify-center z-40 pointer-events-none">
                    <motion.div 
                      initial={{ scale: 0 }} animate={{ scale: [1, 1.1, 1] }} transition={{ repeat: Infinity, duration: 0.5 }}
                      className="bg-rose-600 border-4 border-white text-white px-6 py-2 rounded-xl font-black shadow-[0_0_30px_red]"
                    >
                      ⚠️ ¡TORMENTA DE HIELO EN CAMINO! ⚠️
                    </motion.div>
                 </div>
               )}

               {platforms.map(p => (
                   <div 
                     key={p.id} 
                     className="absolute bg-cyan-100 border-t-[4px] border-white shadow-[0_0_20px_rgba(34,211,238,0.5)] rounded-md z-10" 
                     style={{ left: `${p.x}%`, bottom: `${p.y}%`, width: `${p.w}%`, height: `${p.h}%` }} 
                   />
               ))}

               {icicles.map(ice => (
                   <div 
                     key={ice.id} 
                     className="absolute w-8 h-8 z-15 flex items-center justify-center text-2xl drop-shadow-[0_0_10px_cyan]" 
                     style={{ left: `calc(${ice.x}% - 16px)`, bottom: `${ice.y}%` }} 
                   >
                     🧊
                   </div>
               ))}

               <div 
                 className="absolute w-12 h-12 z-20 transition-transform" 
                 style={{ left: `calc(${player.x}% - 24px)`, bottom: `${player.y}%`, transform: `scaleX(${player.facingRight ? 1 : -1})` }}
               >
                  <img src={PHOTOS.avatar} className="w-full h-full object-cover rounded-full border-[3px] border-white shadow-[0_0_15px_rgba(255,255,255,0.8)]" style={{ imageRendering: 'pixelated' }} />
               </div>
               
               {gameWon && (
                 <div className="absolute inset-0 z-50 flex items-center justify-center bg-sky-900/80 backdrop-blur-sm flex-col">
